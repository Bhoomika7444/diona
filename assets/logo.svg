<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 95" width="380" height="95">
  <g fill="#005a9c">
    <!-- WCB Acronym -->
    <text x="2" y="56" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="52" letter-spacing="-1.5" fill="#005a9c">WCB</text>
    
    <!-- 3 Figures / People Emblem -->
    <!-- Left Person -->
    <circle cx="165" cy="35" r="8.5" fill="#005a9c"/>
    <path d="M152 70 C152 53, 160 48, 165 48 C170 48, 178 53, 178 70 Z" fill="#005a9c"/>
    
    <!-- Center Person (Prominent) -->
