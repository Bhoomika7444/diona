    <path d="M212 70 C212 53, 220 48, 225 48 C230 48, 238 53, 238 70 Z" fill="#005a9c"/>
  </g>
  
  <!-- Subtitle Text: Workers Compensation Board of Manitoba -->
  <text x="2" y="74" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14.5" fill="#005a9c" letter-spacing="-0.2">Workers Compensation</text>
  <text x="2" y="89" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14.5" fill="#005a9c" letter-spacing="-0.2">Board of Manitoba</text>
</svg>
